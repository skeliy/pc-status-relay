<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyrics</title>
<style>
  :root { --bg:#14151c; --card:#232532; --line:#3a3e54; --text:#f4f5f8; --muted:#b0b4c6; --accent:#fa2d48; --open:#c5cbff; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
  body { font:16px/1.65 -apple-system, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif; }
  main { max-width:600px; margin:0 auto; padding:48px 20px; }
  h1 { margin:0 0 28px; font-size:28px; line-height:1.3; }
  p { margin:0 0 16px; }
  .lead { font-size:18px; font-weight:600; }
  .muted { color:var(--muted); }
  /* ブラウザの確認の見本 */
  .mock { max-width:440px; margin:0 0 16px; padding:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .mock-title { font-weight:600; }
  .mock-body { margin:8px 0 18px; color:var(--muted); font-size:14px; }
  .mock-buttons { display:flex; justify-content:flex-end; gap:10px; }
  .mock-buttons span { padding:6px 16px; border-radius:999px; font-size:14px; font-weight:600; }
  .mock-open { color:#16172a; background:var(--open); outline:3px solid var(--accent); outline-offset:3px; }
  .mock-cancel { color:var(--muted); border:1px solid var(--line); }
  .status { display:flex; align-items:center; gap:12px; margin:24px 0 16px; font-weight:600; }
  .spinner { flex:none; width:20px; height:20px; border:3px solid var(--line); border-top-color:var(--text); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration:4s; } }
  button { min-height:40px; padding:8px 16px; border:0; border-radius:8px; color:#fff; background:#454860; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:#55597a; }
  button.primary { background:var(--accent); }
  button.primary:hover { background:#e0213c; }
  button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .buttons { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  .fallback { margin-top:32px; padding-top:24px; border-top:1px solid var(--line); }
  .cmd { display:flex; align-items:center; gap:10px; padding:10px 12px; background:#0d0e13; border:1px solid var(--line); border-radius:8px; }
  .cmd code { flex:1; min-width:0; font:13px ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap:anywhere; }
  .cmd button { flex:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="guide">
    <h1 id="title"></h1>
    <p class="lead" id="pressOpen"></p>
    <div class="mock" aria-hidden="true">
      <div class="mock-title" id="mockTitle"></div>
      <div class="mock-body" id="mockBody"></div>
      <div class="mock-buttons"><span class="mock-open" id="mockOpen"></span><span class="mock-cancel" id="mockCancel"></span></div>
    </div>
    <p class="muted" id="dontCancel"></p>
    <p id="working"></p>
    <div class="status" role="status"><span class="spinner" aria-hidden="true"></span><span id="waiting"></span></div>
    <div class="buttons">
      <button class="primary" id="again" type="button"></button>
      <button id="close" type="button"></button>
    </div>
    <div class="fallback" id="reinstallBox" hidden>
      <p id="notStarting"></p>
      <button id="reinstall" type="button"></button>
    </div>
    <div class="fallback" id="stuckBox" hidden>
      <p id="stuck"></p>
      <div class="cmd"><code id="cmd"></code><button id="copy" type="button"></button></div>
    </div>
  </section>
  <section id="done" hidden>
    <h1 id="doneTitle"></h1>
    <p id="doneBody"></p>
    <div class="buttons"><button class="primary" id="doneClose" type="button"></button></div>
  </section>
</main>
<script src="i18n.js"></script>
<script src="lyrics_setup.js"></script>
</body>
</html>
