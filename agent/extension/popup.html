<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#1b1d27; --card:#252836; --line:#363a4f; --text:#f2f3f7; --muted:#a9adc1; --accent:#fa2d48; --ok:#3ecf8e; }
  * { box-sizing: border-box; }
  body { margin:0; width: 340px; background:var(--bg); color:var(--text); font: 13px/1.5 -apple-system, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif; }
  header { display:flex; align-items:center; gap:8px; padding: 12px 14px; border-bottom:1px solid var(--line); }
  header img { width:22px; height:22px; }
  header b { font-size: 14px; flex:1; }
  header .ver { color: var(--muted); font-size: 11px; }
  section { padding: 10px 14px; border-bottom:1px solid var(--line); }
  section:last-child { border-bottom:0; }
  h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
  .row { display:flex; align-items:center; gap:8px; padding: 5px 0; }
  .row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .svc { color: var(--muted); font-size: 11px; }
  .tag { color: #fbbf24; background: rgba(251,191,36,.14); border-radius: 6px; padding: 1px 6px; font-size: 10px; font-weight: 600; }
  .dot { width:8px; height:8px; border-radius:50%; background: var(--muted); flex:none; }
  .dot.on { background: var(--ok); }
  button { font: inherit; font-size: 12px; font-weight: 600; border: 0; border-radius: 8px; padding: 5px 10px; cursor: pointer; color: #fff; background: #40435a; white-space: nowrap; }
  button.primary { background: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .invite { background: rgba(250,45,72,.12); border:1px solid rgba(250,45,72,.4); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-size: 12px; }
  input, select { width: 100%; padding: 6px 8px; border-radius: 8px; border:1px solid var(--line); background:#151722; color:var(--text); font: inherit; margin-top: 4px; }
  label { display:block; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .notice { color: #ffd479; font-size: 12px; }
  .update { background: rgba(59,130,246,.10); border-bottom: 1px solid rgba(59,130,246,.45); }
  .update > div { margin-bottom: 6px; }
  .update .name { font-weight: 700; font-size: 13px; }
  .update .cmd { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; border-radius: 9px; background: rgba(0,0,0,.25); border: 1px solid var(--line); }
  .update .cmd code { flex: 1; min-width: 0; font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; word-break: break-all; }
  .update .copy { flex: none; padding: 4px 10px; font-size: 12px; }
  .update .link { color: #93c5fd; font-size: 12px; }
  .ver.new { color: #93c5fd; font-weight: 700; }
  ol { margin: 0; padding-left: 1.2em; }
  .lang { position: relative; }
  .lang-btn { display:flex; align-items:center; gap:5px; height:26px; padding:0 8px; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--muted); font-size:11px; font-weight:600; }
  .lang-btn:hover { color: var(--text); }
  .lang-menu { position:absolute; right:0; top:31px; min-width:120px; padding:4px; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 24px rgba(0,0,0,.45); z-index:5; }
  .lang-menu button { display:flex; width:100%; justify-content:space-between; padding:6px 8px; background:none; border-radius:6px; font-weight:500; font-size:12px; }
  .lang-menu button:hover { background: rgba(255,255,255,.06); }
  .lang-menu .check { color: var(--accent); visibility: hidden; }
  .lang-menu button[aria-checked="true"] .check { visibility: visible; }
  .hidden { display: none !important; }
  .switch-row { display:flex; align-items:center; gap:10px; }
  .switch-row .grow { flex:1; min-width:0; }
  .switch { position:relative; flex:none; width:40px; height:24px; padding:0; border-radius:999px; background:#555970; }
  .switch::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s ease; }
  .switch[aria-checked="true"] { background:var(--accent); }
  .switch[aria-checked="true"]::after { transform:translateX(16px); }
  .switch:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .roomrow { display:flex; align-items:center; gap:10px; padding: 8px 10px; margin-bottom: 6px; border:1px solid var(--line); border-radius: 10px; }
  .roomrow.live { border-color: rgba(59,130,246,.6); background: rgba(59,130,246,.10); }
  .roomrow .grow { flex:1; min-width:0; }
  .roomrow .name { font-weight: 600; }
  .small { font-size: 11.5px; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><b id="brand">Listen Together</b><span class="ver" id="ver"></span>
  <div class="lang">
    <button class="lang-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Language">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <span id="langLabel">EN</span>
    </button>
    <div class="lang-menu hidden" id="langMenu" role="menu">
      <button type="button" role="menuitemradio" data-lang="en">English <span class="check">✓</span></button>
      <button type="button" role="menuitemradio" data-lang="ja">日本語 <span class="check">✓</span></button>
    </div>
  </div>
</header>
<div id="app"><section class="empty">…</section></div>
<script src="i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
