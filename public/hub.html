<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>skeliy と とろ</title>

<style>
/* 1ページで「いま何をしているか」「予定」「今週の使い方」を見る。予定表(カレンダー)の見た目に合わせている */
:root{
  --bg:#ffffff; --card:#f6f7f9; --ink:#1f1f1f; --muted:#6b7177; --line:#e3e6ea; --accent:#1a73e8; --nowline:#ea4335; --chip:#eef0f3;
  --online:#1e9e57; --on-accent:#fff; --afk:#e0a100; --custom:#8a5cf6; --bar:#1a73e8; --bar-bg:#e8ebef;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --class:#33b679; --test:#d50000; --study:#3f51b5; --gym:#f4511e; --meal:#f6bf26; --busy:#8e8e8e; --move:#8e8e8e; --brk:#e6f4ea; --brk-ink:#1e7a46; --free:#e9e4fb; --free-ink:#5b45b0; --sleep:#eceff3; --sleep-ink:#6b7480;
  --hour:44px; --gutter:44px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --card:#1a1d22; --ink:#e8eaed; --muted:#9aa0a6; --line:#2b2f35; --accent:#8ab4f8; --nowline:#f28b82; --chip:#22262b;
    --online:#3ddc84; --on-accent:#0b1220; --afk:#f5b301; --custom:#b49cff; --bar:#5b8cff; --bar-bg:#2a2f37;
    --class:#2e9e69; --test:#c62828; --study:#5c6bc0; --gym:#e8622f; --meal:#d8a91a; --busy:#6f7378; --move:#6f7378; --brk:#1d3326; --brk-ink:#7fd1a2; --free:#2a2546; --free-ink:#b9a8ff; --sleep:#1c2026; --sleep-ink:#8a939e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111317; --card:#1a1d22; --ink:#e8eaed; --muted:#9aa0a6; --line:#2b2f35; --accent:#8ab4f8; --nowline:#f28b82; --chip:#22262b;
  --online:#3ddc84; --on-accent:#0b1220; --afk:#f5b301; --custom:#b49cff; --bar:#5b8cff; --bar-bg:#2a2f37;
  --class:#2e9e69; --test:#c62828; --study:#5c6bc0; --gym:#e8622f; --meal:#d8a91a; --busy:#6f7378; --move:#6f7378; --brk:#1d3326; --brk-ink:#7fd1a2; --free:#2a2546; --free-ink:#b9a8ff; --sleep:#1c2026; --sleep-ink:#8a939e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:920px;margin:0 auto;padding:12px 16px 40px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.top h1{font-size:18px;margin:0;font-weight:700}
.top .upd{font-size:11px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.seg button{padding:4px 12px;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}

/* いま */
.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:18px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;cursor:pointer;text-align:left;width:100%}
.pc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pc .who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--online)} .dot.afk{background:var(--afk)} .dot.custom{background:var(--custom)}
.pc .for{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
.pc .main{font-size:20px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .main.off{color:var(--muted);font-size:16px}
.pc .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.pc .plan{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pc .plan i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.pc .plan .nx{color:var(--muted)}

h2{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .hint{font-size:11.5px;color:var(--muted);font-weight:400}
h2 .seg{margin-left:auto}

/* 予定(カレンダー) */
.cal{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .today{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px}
.bar .arrow{width:30px;height:30px;border-radius:50%;font-size:18px;color:var(--muted)}
.bar .arrow:hover{background:var(--chip)}
.bar .range{font-size:14px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:80px}
.bar .seg button{padding:3px 9px}
.head{display:grid;grid-template-columns:var(--gutter) repeat(var(--n),1fr);border-bottom:1px solid var(--line)}
.head .tz{font-size:10px;color:var(--muted);align-self:end;padding:0 4px 6px;text-align:right}
.head .dh{text-align:center;padding:4px 0;border-left:1px solid var(--line);min-width:0}
.head .dw{font-size:11px;color:var(--muted)}
.head .dn{font-size:18px;line-height:30px;width:30px;height:30px;margin:0 auto;border-radius:50%}
.head .today .dw{color:var(--accent)} .head .today .dn{background:var(--accent);color:var(--on-accent)}
.head .ad{display:block;margin:2px 3px 0;font-size:10px;border-radius:4px;background:var(--test);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .tbd{display:block;font-size:10px;color:var(--muted)}
.scroll{max-height:min(60vh,460px);overflow-y:auto;overflow-x:hidden;position:relative}
.grid{display:grid;grid-template-columns:var(--gutter) repeat(var(--n),1fr);position:relative}
.hours{position:relative;height:calc(var(--hour)*24)}
.hours span{position:absolute;right:6px;font-size:10px;color:var(--muted);transform:translateY(-7px)}
.col{position:relative;height:calc(var(--hour)*24);border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hour);min-width:0}
.col.empty{background-color:color-mix(in srgb,var(--chip) 60%,transparent)}
.ev{position:absolute;left:2px;right:3px;border-radius:5px;padding:2px 5px;overflow:hidden;color:#fff;font-size:11.5px;line-height:1.3;border:1px solid var(--bg)}
.ev b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{font-size:10.5px;opacity:.92;white-space:nowrap}
.ev.free{background:var(--free);color:var(--free-ink)} .ev.brk{background:var(--brk);color:var(--brk-ink)} .ev.sleep{background:var(--sleep);color:var(--sleep-ink)} .ev.meal{color:#3b2f00}
.nowline{position:absolute;left:-1px;right:0;height:2px;background:var(--nowline);z-index:3}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--nowline)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.nocal{padding:18px;color:var(--muted);font-size:13px}

/* 予定の変更のお願い(とろ の予定の横のペン) */
.pen{position:relative;width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.pen:hover{background:var(--chip);color:var(--ink)}
.pen svg{width:16px;height:16px}
.pen .badge{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--nowline);border:2px solid var(--bg)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px 12px;overflow-y:auto}
.sheet[hidden]{display:none}
.sheet-card{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;padding:16px 16px 12px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;gap:8px}
.sheet-head b{font-size:16px;flex:1}
.sheet-head button{width:36px;height:36px;border-radius:50%;font-size:22px;color:var(--muted)}
.sheet-head button:hover{background:var(--chip)}
.sheet-help{font-size:12.5px;color:var(--muted);margin:6px 0 10px}
.sheet textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;min-height:72px}
.sheet textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.sheet-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.sheet-row .msg{flex:1;font-size:12.5px;color:var(--muted)}
.sheet-row .msg.err{color:var(--nowline)}
.primary{background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:999px;padding:8px 18px;min-height:40px}
.primary:disabled{opacity:.5;cursor:default}
.reqs{margin-top:14px;border-top:1px solid var(--line)}
.reqs h3{font-size:12.5px;color:var(--muted);font-weight:500;margin:10px 0 4px}
.rq{padding:10px 0;border-bottom:1px dashed var(--line)}
.rq:last-child{border-bottom:0}
.rq .t{white-space:pre-wrap;overflow-wrap:anywhere}
.rq .meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:4px}
.chip{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.chip.wait{color:var(--muted)} .chip.q{color:var(--nowline)} .chip.ok{color:var(--online)} .chip.ng{color:var(--afk)}
.rq .rep{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--chip);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.rq .rep::before{content:"Claude: ";font-weight:700}
.rq .ans{margin:6px 0 0 14px;padding-left:10px;border-left:2px solid var(--line)}
.rq .ansbox{margin-top:8px}
.rq .ansbox textarea{min-height:52px}

/* 今週の使い方 */
.week{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.week .sum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.week .sum b{font-size:16px}
.week .sum span{font-size:12px;color:var(--muted)}
.app{padding:9px 0;border-top:1px solid var(--line)}
.app:first-of-type{border-top:0}
.app .row{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left}
.app .nm{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .nm .tag{font-size:10.5px;font-weight:500;color:var(--custom);border:1px solid var(--custom);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:2px}
.app .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.app .meter{height:6px;border-radius:99px;background:var(--bar-bg);margin-top:6px;overflow:hidden}
.app .meter i{display:block;height:100%;border-radius:99px;background:var(--bar)}
.app.custom .meter i{background:var(--custom)}
.app .more{font-size:12px;color:var(--accent);margin-top:4px;padding:2px 0}
.app ul{list-style:none;margin:6px 0 0;padding:6px 0 0;border-top:1px dashed var(--line)}
.app li{display:flex;gap:10px;font-size:12.5px;color:var(--muted);padding:2px 0}
.app li span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.empty-note{color:var(--muted);font-size:13px;padding:6px 0}
.foot{margin-top:24px;font-size:11px;color:var(--muted);text-align:center}
@media (max-width:520px){
  .wrap{padding:10px 12px 32px}
  :root{--hour:40px;--gutter:36px}
  .pc .main{font-size:18px}
  .ev{padding:1px 3px;font-size:10.5px}
  .bar .range{order:5;flex-basis:100%}
}
</style>
</head>

</div>

  let s = b.replace(/[-_ ]?(Win64|WinGDK|Win32)?[-_ ]?Shipping$/i, '').replace(/[-_ ](x64|x86|DX11|DX12|BE|EAC)$/i, '').replace(/[-_]?(64|32)$/,'');
  s = s.replace(/[_]+/g, ' ').trim();
  if (!s || GENERIC.test(s)) return '';
  if (/^[A-Z0-9 ]+$/.test(s) && /[A-Z]{4,}/.test(s)) s = s.toLowerCase().replace(/\b[a-z]/g, (c) => c.toUpperCase()); // SMALLAND -> Smalland
  else if (!/\s/.test(s) && /[a-z][A-Z]/.test(s)) s = s.replace(/([a-z])([A-Z])/g, '$1 $2');           // WayOfTheHunter -> Way Of The Hunter
  return s;
}
// 1つの状態(実行ファイル名・ウィンドウのタイトル)を、画面に出す名前にする
function appName(exe, title){
  const raw = String(exe || '').trim();
  const base = raw.replace(/\.exe$/i, '');
  const key = base.toLowerCase();
  const t = cleanTitle(title);
  if (key === 'javaw' || key === 'java') return /minecraft/i.test(title || '') ? 'Minecraft' : 'Java';
  if (Object.prototype.hasOwnProperty.call(KNOWN, key)) {
    const v = KNOWN[key];
    if (v) return v;
    return t && t.length <= 40 ? t : (key === 'applicationframehost' ? 'Windows のアプリ' : (prettyBase(base) || t || '不明'));
  }
  if (!base) return t || '不明';
  return prettyBase(base) || (t && t.length <= 40 ? t : base);
}

/* ---------- 時間・日付 ---------- */
function dur(sec){
  sec = Math.max(0, Math.round(sec || 0));
  if (sec < 60) return '1分未満';
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return h ? h + '時間' + (m ? m + '分' : '') : m + '分';
}
const DOW = ['日','月','火','水','木','金','土'];
function offsetMin(zone, ms){ const p = new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(ms)); const g=(t)=>+p.find((x)=>x.type===t).value; let h=g('hour'); if(h===24)h=0; return (Date.UTC(g('year'),g('month')-1,g('day'),h,g('minute'))-Math.floor(ms/6e4)*6e4)/6e4; }
function utcDay(ds){ const [y,m,d]=ds.split('-').map(Number); return Date.UTC(y,m-1,d); }
function addDays(ds,k){ return new Date(utcDay(ds)+k*864e5).toISOString().slice(0,10); }
function localToAbs(zone,ds,min){ const guess=utcDay(ds)+min*6e4; return guess-offsetMin(zone,guess)*6e4; }
function absToLocal(zone,ms){ const off=offsetMin(zone,ms); const t=new Date(ms+off*6e4); return {date:t.toISOString().slice(0,10),min:t.getUTCHours()*60+t.getUTCMinutes()}; }
function hm(m){ return Math.floor(m/60)+':'+String(m%60).padStart(2,'0'); }
function dow(ds){ return new Date(utcDay(ds)).getUTCDay(); }
const md = (ds) => (+ds.slice(5,7)) + '/' + (+ds.slice(8)) + '（' + DOW[dow(ds)] + '）';

const NOWTXT = {class:'授業中',test:'テスト中',study:'勉強中',gym:'筋トレ中',meal:'ご飯中',busy:'用事中',move:'移動中',brk:'休み時間（学校）',free:'自由時間',sleep:'寝ています'};
const LEGEND = {skeliy:['class','test','study','meal','free','sleep'],toro:['class','test','move','brk']};
const SOFT = {free:['--free','--free-ink'],sleep:['--sleep','--sleep-ink'],brk:['--brk','--brk-ink']};
let P = {};
function buildPeople(){
  P = {};
  if (!sched) return;
  Object.keys(sched).forEach((k) => { const S = sched[k]; if (!S || !S.data) return; const abs=[], known=[], allday=[];
    Object.keys(S.data).sort().forEach((ds) => (S.data[ds] || []).forEach(([s,e,c,l]) => { const a=localToAbs(S.tz,ds,s), b=localToAbs(S.tz,ds,e); const last=abs[abs.length-1];
      if (last && last.c===c && last.b===a && !l && !last.l) last.b=b; else abs.push({a,b,c,l}); }));
    (S.known || []).forEach((ds) => known.push([localToAbs(S.tz,ds,0),localToAbs(S.tz,ds,1440)]));
    if (S.range) known.push([localToAbs(S.tz,S.range[0],0),localToAbs(S.tz,S.range[1],1440)]);
    Object.keys(S.allday || {}).forEach((ds) => allday.push({a:localToAbs(S.tz,ds,0),b:localToAbs(S.tz,ds,1440),l:S.allday[ds]}));
    P[k] = {abs,known,allday,empty:k==='toro'?'授業なし':'予定未定'}; });
}
const fmtAbs = (ms) => hm(absToLocal(tz,ms).min);
const whenAbs = (ms) => { const L=absToLocal(tz,ms), T=absToLocal(tz,Date.now()); return (L.date===T.date?'':(L.date===addDays(T.date,1)?'明日 ':md(L.date)+' '))+hm(L.min); };
const lab = (x) => x.l || CAT[x.c];
const colorOf = (c) => SOFT[c] ? 'var('+SOFT[c][1]+')' : 'var(--'+c+')';
function planNow(k){
  const X = P[k]; if (!X) return '';
  const now = Date.now(); const cur = X.abs.find((x) => x.a<=now && now<x.b);
  if (!cur) { const ad = X.allday.find((x) => x.a<=now && now<x.b); const known = X.known.some(([a,b]) => a<=now && now<b); const nx = X.abs.find((x) => x.a>now);
    return '<i style="background:var(--muted)"></i><span>予定: <b>'+esc(ad ? '今日は'+ad.l : (known ? X.empty : '予定未定'))+'</b></span>'+(nx && known ? '<span class="nx">次は'+esc(lab(nx))+' '+whenAbs(nx.a)+'〜</span>' : ''); }
  const nx = X.abs[X.abs.indexOf(cur)+1];
  const txt = cur.c==='class' && cur.l ? cur.l+'中' : NOWTXT[cur.c];
  return '<i style="background:'+colorOf(cur.c)+'"></i><span>予定: <b>'+esc(txt)+'</b>（'+fmtAbs(cur.b)+'まで）</span>'+(nx ? '<span class="nx">次は'+esc(lab(nx))+' '+whenAbs(nx.a)+'〜</span>' : '');
}
function dayView(ds){
  const X = P[who]; const a0=localToAbs(tz,ds,0), b0=localToAbs(tz,ds,1440); const segs=[];
  X.abs.forEach((x) => { if (x.b<=a0 || x.a>=b0) return; segs.push({s:(Math.max(x.a,a0)-a0)/6e4,e:(Math.min(x.b,b0)-a0)/6e4,c:x.c,l:x.l,a:x.a,b:x.b}); });
  const ad = X.allday.filter((x) => { const ov=Math.min(x.b,b0)-Math.max(x.a,a0); return ov>=(x.b-x.a)/2; }).map((x) => x.l);
  return {segs,covered:X.known.some(([a,b]) => a<b0 && b>a0),ad};
}

    html += '</div>'; });
  $('grid').innerHTML = html;

async function pollReqs(){ try { const d = await get('/api/sched-requests'); reqs = d.requests || []; autoFire = !!d.autoFire; renderReqs(); } catch (e) {} }
async function sendReq(text, replyTo, btn, msg, done){

  btn.disabled = true; msg.className = 'msg'; msg.textContent = '送っています…';
  try {
    const u = new URL('/api/sched-requests', location.origin); if (TOKEN) u.searchParams.set('token', TOKEN);
    const r = await fetch(u.toString(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ person: who, text, replyTo: replyTo || null }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error === 'too-many' ? 'まだ反映していないお願いが多すぎます。少し待ってから送ってください。' : '送れませんでした（'+(d.error || r.status)+'）。');
    if (done) done();
    msg.textContent = d.autoFire ? '送りました。数分で反映します。' : '送りました。1時間以内に反映します。';
    await pollReqs();
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message || '送れませんでした。'; }
  btn.disabled = false;
}
let lastFocus = null;
function openSheet(){ lastFocus = document.activeElement; $('sheet').hidden = false; $('reqMsg').textContent = ''; renderReqs(); pollReqs(); setTimeout(() => $('reqText').focus(), 0); }
function closeSheet(){ $('sheet').hidden = true; if (lastFocus) lastFocus.focus(); }
$('pen').onclick = openSheet;
$('sheetClose').onclick = closeSheet;
$('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
$('reqSend').onclick = () => sendReq($('reqText').value, null, $('reqSend'), $('reqMsg'), () => { $('reqText').value = ''; });

document.querySelectorAll('[data-tz]').forEach((b) => b.onclick = () => { tz = b.dataset.tz; store.set('hub-tz', tz); start = null; renderAll(); scrollToNow(); });
document.querySelectorAll('[data-n]').forEach((b) => b.onclick = () => { n = +b.dataset.n; store.set('hub-n', n); start = null; renderCal(); });
document.querySelectorAll('[data-w]').forEach((b) => b.onclick = () => { wsel = b.dataset.w; renderWeek(); });
$('goToday').onclick = () => { start = null; renderCal(); scrollToNow(); };
$('prev').onclick = () => { if (!start) return; start = addDays(start, -n); renderCal(); };
$('next').onclick = () => { if (!start) return; start = addDays(start, n); renderCal(); };

window.__hub = { appName, cleanTitle };
renderAll();
Promise.all([pollStatus(), pollWeek(), pollSched()]).then(() => { renderAll(); scrollToNow(); });
setInterval(pollStatus, 5000);
setInterval(pollWeek, 60000);
setInterval(pollSched, 300000);
pollReqs();
setInterval(pollReqs, 60000);
setInterval(() => { renderNow(); renderCal(); }, 60000);
})();
</script>
