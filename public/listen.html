<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Listen together</title>
<style>
  :root {
    --bg: #0d0e12;
    --surface: #16171d;
    --surface-2: #1d1f27;
    --line: #2a2c36;
    --line-strong: #3a3d4a;
    --text: #f4f5f8;
    --muted: #9a9eb0;
    --faint: #6b6f80;
    --accent: #fa2d48;
    --accent-soft: rgba(250, 45, 72, .12);
    --ok: #35c98a;
    --danger: #ff7b7b;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    min-height: 100vh;
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 420px at 50% -120px, rgba(250, 45, 72, .16), transparent 70%),
      var(--bg);
  }
  .hidden { display: none !important; }

  /* top bar */
  header {
    max-width: 480px; margin: 0 auto; padding: 18px 16px 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(140deg, #ff5a6e, #e01b3c); box-shadow: 0 4px 14px rgba(250, 45, 72, .35);
  }
  .lang { position: relative; }
  .lang-btn {
    display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 9px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
    color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
  }
  .lang-btn:hover, .lang-btn[aria-expanded="true"] { color: var(--text); border-color: var(--line-strong); }
  .lang-menu {
    position: absolute; right: 0; top: 40px; min-width: 140px; padding: 6px; z-index: 10;
    background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
  }
  .lang-menu button {
    display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--text);
    font: inherit; font-size: 14px; cursor: pointer; text-align: left;
  }
  .lang-menu button:hover { background: rgba(255, 255, 255, .06); }
  .lang-menu .check { color: var(--accent); visibility: hidden; }
  .lang-menu button[aria-checked="true"] .check { visibility: visible; }

  /* main */
  main { max-width: 480px; margin: 0 auto; padding: 36px 16px 56px; }
  .hero { text-align: center; margin-bottom: 26px; }
  .hero h1 { font-size: 26px; line-height: 1.25; letter-spacing: -.01em; margin: 0 0 8px; font-weight: 700; }
  .hero p { margin: 0 auto; max-width: 360px; color: var(--muted); }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; box-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset;
  }
  .card + .card { margin-top: 14px; }
  .card h2 { font-size: 16px; margin: 0 0 4px; font-weight: 650; }
  .card .lead { color: var(--muted); margin: 0 0 18px; font-size: 14px; }

  .field { display: block; margin-top: 18px; }
  .field:first-child { margin-top: 0; }
  .field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 7px; }
  input[type=text], input[type=password] {
    width: 100%; height: 44px; padding: 0 14px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus, input[type=password]:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .services { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .svc { position: relative; }
  .svc input { position: absolute; opacity: 0; pointer-events: none; }
  .svc span {
    display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--bg);
    font-size: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: border-color .15s, background .15s;
  }
  .svc span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .svc:hover span { border-color: var(--line-strong); }
  .svc input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
  .svc input:focus-visible + span { box-shadow: 0 0 0 3px var(--accent-soft); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 46px;
    margin-top: 20px; border: 0; border-radius: 12px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 650; cursor: pointer; text-decoration: none;
    transition: filter .15s, transform .05s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: default; filter: none; }
  .err { color: var(--danger); font-size: 14px; margin-top: 10px; min-height: 1.2em; }
  .err:empty { display: none; }

  .state { display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(53, 201, 138, .15); }

  .steps { list-style: none; counter-reset: s; margin: 20px 0 0; padding: 0; }
  .steps li { counter-increment: s; display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .steps li:first-child { border-top: 0; padding-top: 0; }
  .steps li::before {
    content: counter(s); flex: none; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--muted);
  }
  code {
    font: 12.5px ui-monospace, SFMono-Regular, Consolas, monospace; padding: 1px 6px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--line); white-space: nowrap;
  }
  .note { color: var(--faint); font-size: 13px; margin: 14px 0 0; }
  .note code { white-space: normal; word-break: break-all; }
  .grow { flex: 1; min-width: 0; }
  .grow .cmd { margin-top: 8px; }
  .cmd { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 11px; background: var(--bg); border: 1px solid var(--line-strong); }
  .cmd code { flex: 1; min-width: 0; border: 0; padding: 0; background: none; white-space: normal; word-break: break-all; font-size: 12.5px; color: var(--text); }
  .copy { flex: none; height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .copy:hover { border-color: var(--accent); }
  .copy.done { color: var(--ok); border-color: var(--ok); }
  .os-tabs { display: flex; gap: 4px; padding: 4px; margin: 0 0 18px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
  .os-tabs button {
    flex: 1; height: 34px; border: 0; border-radius: 9px; background: none; color: var(--muted);
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .os-tabs button:hover { color: var(--text); }
  .os-tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .os-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  details.alt { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  details.alt summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details.alt summary:hover { color: var(--text); }
  details.alt[open] summary { margin-bottom: 14px; }
  .hint { color: var(--muted); font-size: 13px; margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
  .hint:empty { display: none; }

  .who {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 4px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--surface-2); border: 1px solid var(--line-strong); font-weight: 700;
  }
  .who b { display: block; font-weight: 600; }
  .who small { color: var(--muted); font-size: 13px; }

  .success { text-align: center; }
  .success .icon {
    width: 52px; height: 52px; margin: 2px auto 14px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(53, 201, 138, .14); color: var(--ok);
  }
  .success h2 { font-size: 18px; }
  .success p { color: var(--muted); margin: 6px 0 0; font-size: 14px; }

  footer { text-align: center; color: var(--faint); font-size: 12px; margin-top: 28px; }

  @media (max-width: 380px) {
    .hero h1 { font-size: 22px; }
    .card { padding: 18px; }
    .svc span { padding: 0 10px; font-size: 13.5px; }
  }
  @media (max-width: 330px) {
    .services { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5" fill="#fff"/><rect x="17" y="14" width="4" height="7" rx="1.5" fill="#fff"/></svg>
    </span>
    <span data-i18n="brand"></span>
  </div>
  <div class="lang">
    <button class="lang-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Language">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <span id="langLabel">EN</span>
    </button>
    <div class="lang-menu hidden" id="langMenu" role="menu">
      <button type="button" role="menuitemradio" data-lang="en">English <span class="check">✓</span></button>
      <button type="button" role="menuitemradio" data-lang="ja">日本語 <span class="check">✓</span></button>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <h1 id="title" data-i18n="titleDefault"></h1>
    <p id="subtitle" data-i18n="loading"></p>
  </div>

  <section class="card hidden" id="closedCard">
    <div class="state"><span class="dot"></span><span id="closedText"></span></div>
  </section>

  <section class="card hidden" id="joinCard">
    <form id="joinForm" autocomplete="off">
      <label class="field">
        <span data-i18n="nameLabel"></span>
        <input type="text" id="name" maxlength="40" required>
      </label>
      <div class="field">
        <span data-i18n="serviceLabel"></span>
        <div class="services">
          <label class="svc" style="--c:#fa2d48"><input type="radio" name="service" value="apple" required><span>Apple Music</span></label>
          <label class="svc" style="--c:#1ed760"><input type="radio" name="service" value="spotify"><span>Spotify</span></label>
          <label class="svc" style="--c:#ff4e45"><input type="radio" name="service" value="ytm"><span>YouTube Music</span></label>
          <label class="svc" style="--c:#ff0033"><input type="radio" name="service" value="youtube"><span>YouTube</span></label>
        </div>
      </div>
      <label class="field">
        <span data-i18n="passwordLabel"></span>
        <input type="password" id="password" required>
      </label>
      <button class="btn" type="submit" id="joinButton" data-i18n="joinButton"></button>
      <div class="err" id="joinError"></div>
    </form>
  </section>

  <section class="card hidden" id="installCard">
    <h2 data-i18n="installTitle"></h2>
    <p class="lead" id="installReason"></p>
    <div class="os-tabs" role="tablist" aria-label="OS">
      <button type="button" role="tab" data-os="win" aria-selected="true">Windows</button>
      <button type="button" role="tab" data-os="mac" aria-selected="false">Mac</button>
    </div>
    <ol class="steps">
      <li><div class="grow"><span data-i18n-html="cmdStep1"></span>
        <div class="cmd"><code id="installCmd"></code><button class="copy" type="button" id="copyCmd" data-i18n="copy"></button></div></div></li>
      <li><span data-i18n-html="cmdStep2"></span></li>
      <li><span data-i18n-html="cmdStep3"></span></li>
      <li><span data-i18n-html="cmdStep4"></span></li>
    </ol>
    <p class="note" data-i18n-html="autoNote"></p>
    <details class="alt">
      <summary data-i18n="manualTitle"></summary>
      <a class="btn" href="/listen-ext.zip" download style="margin-top:0">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>
        <span data-i18n="downloadButton"></span>
      </a>
      <ol class="steps">
        <li><span data-i18n-html="step1"></span></li>
        <li><span data-i18n-html="step2"></span></li>
        <li><span data-i18n-html="step3"></span></li>
        <li><span data-i18n-html="step4"></span></li>
        <li><span data-i18n-html="step5"></span></li>
      </ol>
      <p class="note" data-i18n-html="updateNote"></p>
    </details>
  </section>

  <section class="card hidden" id="readyCard">
    <h2 data-i18n="readyTitle"></h2>
    <p class="lead" data-i18n="readyLead"></p>
    <div class="who">
      <span class="avatar" id="readyAvatar"></span>
      <div><b id="readyName"></b><small id="readyService"></small></div>
    </div>
    <p class="hint" id="updateHint"></p>
    <button class="btn" id="enterButton" data-i18n="enterButton"></button>
    <div class="err" id="enterError"></div>
  </section>

  <section class="card success hidden" id="doneCard">
    <div class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
    <h2 data-i18n="doneTitle"></h2>
    <p id="doneText"></p>
    <p class="note" data-i18n="doneNote"></p>
  </section>

  <footer data-i18n="footer"></footer>
</main>

      copied: 'コピーしました',
      cmdStep1: '<b>コピー</b>を押します。',
      cmdStep2: '<b>Windows キー</b>を押しながら <b>R</b> を押します。小さな<b>ファイル名を指定して実行</b>の画面が開くので、<b>Ctrl+V</b> を押してから <b>Enter</b> を押します。別の画面が開き、<b>完了しました</b>と出たら、その画面は閉じてかまいません。<br><small>うまくいかない時は、Windows キーを押して <b>powershell</b> と入力して Enter を押し、開いた画面で Ctrl+V と Enter を押しても入れられます。</small>',
      cmdStep3: '<code>chrome://extensions</code> を開いて、右上の<b>デベロッパーモード</b>をオンにします。<b>パッケージ化されていない拡張機能を読み込む</b>を押し、<b>Ctrl+V</b> を押してから<b>フォルダーの選択</b>を押します。',
      cmdStep4: 'このページを再読み込みします。',
      autoNote: '新しい版は自動で入ります。前に zip で入れた人は、先にそちらを削除してください。やめる時は、<code>powershell -NoExit -Command "irm ORIGIN/listen-uninstall.ps1 | iex"</code> を同じように <b>Windows キー + R</b> の画面に貼り付けて実行します。',
      cmdStep2Mac: '<b>Cmd+Space</b> を押して <b>ターミナル</b>(Terminal)と入力し、<b>Return</b> を押します。開いた画面で <b>Cmd+V</b> を押してから <b>Return</b> を押し、<b>完了しました</b>と出るまで待ちます。',
      cmdStep3Mac: '<code>chrome://extensions</code> を開いて、右上の<b>デベロッパーモード</b>をオンにします。<b>パッケージ化されていない拡張機能を読み込む</b>を押し、<b>Cmd+Shift+G</b> を押してから <b>Cmd+V</b> と <b>Return</b> を押し、<b>選択</b>を押します。',
      autoNoteMac: '新しい版は自動で入ります。前に zip で入れた人は、先にそちらを削除してください。やめる時は <code>curl -fsSL ORIGIN/listen-uninstall.sh | bash</code> を実行します。',
      manualTitle: 'コマンドを使いたくない人は zip で入れる',
      updateAvailable: (a, b) => `新しい版(${b})があります(今は ${a})。このまま参加できます。コマンドで入れた人は、自動で新しい版になります。`,
      downloadButton: '拡張機能をダウンロード(zip)',
      step1: 'ダウンロードした <code>pcs-music-share.zip</code> を右クリックして、<b>すべて展開</b> を選びます。',
      step1Mac: 'ダウンロードフォルダの <code>pcs-music-share.zip</code> をダブルクリックして展開します。',
      step2: 'アドレスバーに <code>chrome://extensions</code> と入力して開きます(Edge は <code>edge://extensions</code>、Brave は <code>brave://extensions</code>)。',
      step3: '右上の <b>デベロッパーモード</b> をオンにします。オンのままにしておいてください。',
      step4: '<b>パッケージ化されていない拡張機能を読み込む</b> を押して、展開してできた <code>pcs-music-share</code> フォルダを選びます。',
      step5: 'パズルのマークから赤いヘッドホンのアイコンを固定して、このページを再読み込みします。パスワードを入れ直す必要はありません。',
      updateNote: 'zip で入れた場合は、自動では新しくなりません。入れ替える時は、古い <code>pcs-music-share</code> フォルダの中身を新しいものに置き換えてから、拡張機能ページでこの拡張機能の更新ボタン(↻)を押してください。',
      readyTitle: '準備ができました',
      readyLead: '部屋に入って、音楽サービスを開きます。',
      enterButton: '参加して音楽サービスを開く',
      noReply: '拡張機能から返事がありません。拡張機能ページで有効になっているか確認して、このページを再読み込みしてください。',
      extFailed: '拡張機能に渡せませんでした。',
      doneTitle: '参加しました',
      doneOpened: (s) => `${s} を新しいタブで開きました。そのタブで曲を流してください。`,
      doneExisting: (s) => `開いている ${s} のタブで、そのまま聴けます。`,
      doneNote: '音楽サービスのページの右下に、参加中の人と「退出」ボタンが出ます。誰かが曲を選ぶと、みんなにも同じ曲が流れます。タブを閉じると部屋から出ますが、拡張機能のアイコンからまた招待を受け取れます。',
      footer: 'パスワードは、この部屋に入るためだけに使われます。',
    },
  };
  const LANG_KEY = 'pcs-listen-lang';
  let lang = 'en';
  let os = 'win'; // 入れ方のタブ(初めは Windows)
  try { if (localStorage.getItem(LANG_KEY) === 'ja') lang = 'ja'; } catch (e) {}
  const t = (key, ...args) => { const v = T[lang][key]; return typeof v === 'function' ? v(...args) : v; };

  const SERVICE_NAMES = { apple: 'Apple Music', spotify: 'Spotify', ytm: 'YouTube Music', youtube: 'YouTube' };
  const roomId = (location.pathname.match(/^\/listen\/([a-z0-9-]+)/) || [])[1] || '';
  const storeKey = 'pcs-listen-' + roomId;
  const $ = (id) => document.getElementById(id);
  const show = (id, on) => $(id).classList.toggle('hidden', !on);
  let info = null;
  let infoError = false;
  let extVersion = null;
  let creds = null;
  let joined = null; // { opened }
  let errors = { join: null, enter: null }; // 表示中のエラー(言語を切り替えても訳し直せるように、キーで持つ)

  try { creds = JSON.parse(sessionStorage.getItem(storeKey) || 'null'); } catch (e) {}

  // ---- 言語メニュー ----
  const langBtn = $('langBtn'), langMenu = $('langMenu');
  function setMenu(open) { langMenu.classList.toggle('hidden', !open); langBtn.setAttribute('aria-expanded', String(open)); }
  langBtn.addEventListener('click', (e) => { e.stopPropagation(); setMenu(langMenu.classList.contains('hidden')); });
  document.addEventListener('click', () => setMenu(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
  langMenu.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    setMenu(false);
    applyLang();
  }));

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('brand');
    $('langLabel').textContent = lang === 'ja' ? '日本語' : 'EN';
    langMenu.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.lang === lang)));
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    // Windows と Mac で違う手順は、Mac の時だけ「〜Mac」の文を使う
    const osKey = (k) => (os === 'mac' && T[lang][k + 'Mac'] ? k + 'Mac' : k);
    document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(osKey(el.dataset.i18nHtml)).replace(/ORIGIN/g, location.origin); }); // 固定の文だけ(入力は入れない)
    render();
  }

  // 拡張機能を入れるコマンド(Windows は PowerShell、Mac はターミナルに貼り付ける)。初めは Windows
  const INSTALL_CMDS = {
    // Windows キー + R の画面に貼り付けて Enter で動くように、powershell を起動する形にする。
    // 終わっても画面が閉じないように -NoExit を付ける(「完了しました」やエラーが読めるように)。
    // PowerShell の画面に貼り付けても同じように動く。「ファイル名を指定して実行」は259文字までなので短く保つ
    win: `powershell -NoExit -NoProfile -ExecutionPolicy Bypass -Command "irm ${location.origin}/listen-install.ps1 | iex"`,
    mac: `curl -fsSL ${location.origin}/listen-install.sh | bash`,
  };
  function setOs(next) {
    os = next === 'mac' ? 'mac' : 'win';
    document.querySelectorAll('.os-tabs [data-os]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.os === os)));
    $('installCmd').textContent = INSTALL_CMDS[os];
    applyLang();
  }
  document.querySelectorAll('.os-tabs [data-os]').forEach((b) => b.addEventListener('click', () => setOs(b.dataset.os)));
  $('installCmd').textContent = INSTALL_CMDS[os];
  $('copyCmd').addEventListener('click', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(INSTALL_CMDS[os]); ok = true; } catch (e) {}
    if (!ok) {
      // クリップボードに書けない時は、コマンドを選択状態にしておく(Ctrl+C でコピーできる)
      const range = document.createRange(); range.selectNodeContents($('installCmd'));
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      return;
    }
    $('copyCmd').textContent = t('copied'); $('copyCmd').classList.add('done');
    setTimeout(() => { $('copyCmd').textContent = t('copy'); $('copyCmd').classList.remove('done'); }, 1800);
  });

  function errText(e) {
    if (!e) return '';
    return e.args ? t(e.key, ...e.args) : t(e.key);
  }

  // ---- 拡張機能とのやり取り(listen.js) ----
  window.addEventListener('message', (e) => {
    if (e.source !== window || !e.data || e.data.source !== 'pcs-ext') return;
    if (e.data.type === 'hello') { extVersion = e.data.version; render(); }
    if (e.data.type === 'joined') { joined = { opened: !!e.data.opened }; render(); }
    if (e.data.type === 'join-error') {
      errors.enter = e.data.error && !/拡張機能に渡せません/.test(e.data.error) ? { key: 'joinFailed', args: [e.data.error] } : { key: 'extFailed' };
      $('enterButton').disabled = false;
      render();
    }
  });
  window.postMessage({ source: 'pcs-listen', type: 'ping' }, '*');

  function versionLess(a, b) {
    const pa = String(a || '0').split('.').map(Number), pb = String(b || '0').split('.').map(Number);
    for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) < (pb[i] || 0); }
    return false;
  }

  function render() {
    $('joinError').textContent = errText(errors.join);
    $('enterError').textContent = errText(errors.enter);
    if (infoError && !info) { $('subtitle').textContent = t('serverDown'); return; }
    if (!info) return;
    const owner = info.owner || roomId;
    $('title').textContent = t('title', owner);
    const all = ['closedCard', 'joinCard', 'installCard', 'readyCard', 'doneCard'];
    if (joined && creds) {
      all.forEach((id) => show(id, id === 'doneCard'));
      $('subtitle').textContent = '';
      const s = SERVICE_NAMES[creds.service];
      $('doneText').textContent = (joined.opened ? t('doneOpened', s) : t('doneExisting', s)) + (creds.host ? ' ' + t('doneHost') : '');
      return;
    }
    if (creds && !info.open) {
      // 入った後に部屋が閉じた(鍵はもう使えない)→ 入り直してもらう
      creds = null;
      try { sessionStorage.removeItem(storeKey); } catch (e) {}
    }
    // 閉じていても、中継サーバーがパスワードを覚えていれば、ホストとして開ける(ホストは同時に1人だけ)
    const starting = !info.open && !!info.canHost && !creds;
    if (!creds && !starting && (!info.open || !info.guestsAllowed)) {
      $('subtitle').textContent = '';
      $('closedText').textContent = !info.open ? t('closed', owner) + ' ' + t('closedHint') : t('noGuests');
      all.forEach((id) => show(id, id === 'closedCard'));
      return;
    }
    $('subtitle').textContent = starting ? t('startSubtitle') : t('subtitle');
    $('joinButton').textContent = starting ? t('startButton') : t('joinButton');
    // 大きな変更(先頭の数字が上がった時)だけ入れ替えが必要。細かい修正なら古い版のままでも参加できる
    const major = (v) => parseInt(String(v || '0').split('.')[0], 10) || 0;
    const outdated = !!(extVersion && info.extVersion && major(extVersion) < major(info.extVersion));
    const behind = !!(extVersion && info.extVersion && versionLess(extVersion, info.extVersion));
    const needInstall = !!creds && (!extVersion || outdated);
    show('closedCard', false);
    show('joinCard', !creds);
    show('installCard', needInstall);
    show('readyCard', !!creds && !!extVersion && !outdated);
    show('doneCard', false);
    $('installReason').textContent = outdated ? t('outdated', extVersion, info.extVersion) : t('installReason');
    $('updateHint').textContent = behind && !outdated ? t('updateAvailable', extVersion, info.extVersion) : '';
    if (creds) {
      $('readyAvatar').textContent = (creds.label || '?').trim().charAt(0).toUpperCase();
      $('readyName').textContent = creds.label;
      $('readyService').textContent = SERVICE_NAMES[creds.service] || '';
    }
  }

  async function loadInfo() {
    try {
      const r = await fetch('/api/room/info?room=' + encodeURIComponent(roomId), { cache: 'no-store' });
      info = await r.json();
      infoError = false;
    } catch (e) {
      infoError = true;
    }
    render();
  }

  $('joinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const service = (document.querySelector('input[name=service]:checked') || {}).value;
    const label = $('name').value.trim();
    const password = $('password').value;
    if (!service || !label || !password) return;
    $('joinButton').disabled = true;
    errors.join = null;
    render();
    try {
      // 開いていれば参加、閉じていればホストとして開く(同じ入口)
      const body = JSON.stringify({ room: roomId, label, service, password });
      let r = await fetch('/api/room/host', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      let j = await r.json();
      if (r.status === 404 && j.error === 'not found') {
        r = await fetch('/api/room/join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
        j = await r.json();
      }
      if (!r.ok) {
        const key = { 'wrong-password': 'wrongPassword', 'too-many-attempts': 'tooMany', 'guests-not-allowed': 'noGuests', 'room is not open': 'roomClosed', 'unknown-room': 'roomClosed' }[j.error];
        errors.join = key ? { key } : { key: 'joinFailed', args: [j.error || r.status] };
        return;
      }
      creds = { relay: location.origin, room: roomId, token: j.token, label, service, owner: j.owner, pass: j.pass || null, host: !!j.host };
      info = Object.assign({}, info, { open: true, owner: j.owner || (info && info.owner), canHost: false }); // 今開いた/入った
      try { sessionStorage.setItem(storeKey, JSON.stringify(creds)); } catch (err) {}
      $('password').value = '';
    } catch (err) {
      errors.join = { key: 'noServer' };
    } finally {
      $('joinButton').disabled = false;
      render();
    }
  });

  $('enterButton').addEventListener('click', () => {
    if (!creds) return;
    $('enterButton').disabled = true;
    errors.enter = null;
    render();
    window.postMessage({ source: 'pcs-listen', type: 'join', creds }, '*');
    setTimeout(() => {
      if (!joined) {
        $('enterButton').disabled = false;
        errors.enter = { key: 'noReply' };
        render();
      }
    }, 4000);
  });

  applyLang();
  loadInfo();
  setInterval(loadInfo, 30000);
})();
</script>
</body>
